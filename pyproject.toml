# Este ficheiro e a configuracao do pytest, do ruff e do mypy. NAO e um
# manifesto de dependencias.
#
# ate 2026-09-28 tinha aqui [build-system], [project] e [tool.setuptools], com
# name = "maouse" e uma lista de dependencias. Estavam mortos:
#
#   * o produto e entregue por PyInstaller (build.bat + maouse.spec), nao por
#     pip — `git grep "pip install \."` nao devolve nada no repositorio;
#   * as dependencias sao instaladas pelo setup.bat, a partir de requirements.txt;
#   * o nome mentia: o projecto e Maouse. A string "maouse" estava no ficheiro
#     desde o commit que o criou e nunca foi revista.
#
# Manter uma segunda lista de dependencias ao lado do requirements.txt e
# exactamente o risco que deixou o bug do cryptography invisivel: um manifesto
# errado enquanto o outro dizia a verdade. requirements.txt e
# requirements-linux.txt sao a unica fonte de verdade, e
# tests/test_manifests.py compara-os com os imports reais do codigo.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: testes demorados (não correm no CI por omissão)",
           "websocket: testes que arrancam o servidor WebSocket local"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "*.egg-info", "patches"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

# i18n.py e uma tabela de traducao: 1641 linhas, uma traducao por linha. As
# mensagens longas de alem de 100 colunas quebram-se mal com concatenacao
# implicita, porque quem traduz tem de ler e editar a frase inteira, e uma
# frase partida em duas deixa de se encontrar com um grep. O E501 e a regra
# certa para codigo e a regra errada para dados, por isso isenta-se aqui o
# ficheiro em vez de desligar a regra, que continua activa em todo o resto
# do projecto.
[tool.ruff.lint.per-file-ignores]
"i18n.py" = ["E501"]

# As anotacoes de retorno de `@dbus_property` e `@method` sao **assinaturas
# D-Bus**, nao anotacoes Python: `-> "o"` e um caminho de objecto, `-> "as"` e um
# array de strings, `-> "ay"` e um array de bytes. Nao existe nome `as` em
# Python, e um `o` solto seria uma variavel por resolver, portanto o ruff
# acusa F722 (erro de sintaxe numa anotacao) e F821 (nome indefinido) em codigo
# que esta certo.
#
# O UP037 e o outro lado da mesma moeda: manda tirar as aspas, e sem elas
# `-> as` passa a ser erro de sintaxe e `-> o` uma variavel por resolver.
#
# Silenciar aqui e nao em todo o projecto: F821 e uma regra que apanha bugs a
# serio, e so este ficheiro usa assinaturas D-Bus como anotacoes.
"core/remote_ble.py" = ["F722", "F821", "UP037"]

[tool.mypy]
python_version = "3.10"
exclude = [".venv", "build", "dist"]
ignore_missing_imports = true
check_untyped_defs = true
# tools/ nao tem __init__.py (namespace package): sem esta flag o mypy vê
# ferramenta.py duas vezes, como "tools.ferramenta" e como "ferramenta".
namespace_packages = true
