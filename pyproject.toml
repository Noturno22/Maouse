# Este ficheiro e a configuracao do pytest, do ruff e do mypy. NAO e um
# manifesto de dependencias.
#
# ate 2026-09-28 tinha aqui [build-system], [project] e [tool.setuptools], com
# name = "airmouse" e uma lista de dependencias. Estavam mortos:
#
#   * o produto e entregue por PyInstaller (build.bat + airmouse.spec), nao por
#     pip — `git grep "pip install \."` nao devolve nada no repositorio;
#   * as dependencias sao instaladas pelo setup.bat, a partir de requirements.txt;
#   * o nome mentia: o projecto e Maouse. A string "airmouse" estava no ficheiro
#     desde o commit que o criou e nunca foi revista.
#
# Manter uma segunda lista de dependencias ao lado do requirements.txt e
# exactamente o risco que deixou o bug do cryptography invisivel: um manifesto
# errado enquanto o outro dizia a verdade. requirements.txt e
# requirements-linux.txt sao a unica fonte de verdade, e
# tests/test_manifests.py compara-os com os imports reais do codigo.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: testes demorados (não correm no CI por omissão)",
           "websocket: testes que arrancam o servidor WebSocket local"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "*.egg-info", "patches"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
exclude = [".venv", "build", "dist"]
ignore_missing_imports = true
check_untyped_defs = true
# tools/ nao tem __init__.py (namespace package): sem esta flag o mypy vê
# ferramenta.py duas vezes, como "tools.ferramenta" e como "ferramenta".
namespace_packages = true
