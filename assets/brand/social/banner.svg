<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A12"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50C8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3C3CEB" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Hand symbol left -->
  <g transform="translate(80, 50) scale(1.3)" filter="url(#neonGlow)">
    <path d="M60 280 L60 220 Q60 195 75 178 L90 162" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M140 280 L140 220 Q140 195 125 178 L90 162" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 220 Q52 170 68 135 L90 110 L112 135 Q128 170 140 220 Z" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="url(#glow)"/>
    <path d="M60 185 Q30 170 22 138 Q14 105 30 98 Q46 90 52 115 L70 148" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M75 138 L67 62 Q67 42 80 37 Q93 32 95 52 L95 110" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M95 110 L95 42 Q95 18 108 13 Q121 8 122 32 L122 102" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M122 112 L125 50 Q127 28 142 23 Q157 18 154 42 L145 108" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M145 120 L152 62 Q155 40 168 38 Q181 36 176 58 L164 116" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g transform="translate(76, 166)">
      <path d="M12 0 L12 24 L6 18 L0 28 L5 30 L11 20 L12 24" fill="#F0F4F8"/>
    </g>
    <circle cx="90" cy="172" r="55" stroke="#50C8FF" stroke-width="1.5" fill="none" opacity="0.1"/>
    <circle cx="90" cy="172" r="80" stroke="#50C8FF" stroke-width="1.5" fill="none" opacity="0.05"/>
  </g>

  <!-- Wordmark center-right -->
  <g transform="translate(550, 160)">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="100" fill="#50C8FF">Mã</text>
    <path d="M132 30 Q148 22 164 30 Q180 38 196 30" stroke="#50C8FF" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(0, -52)"/>
    <text font-family="'Space Grotesk', sans-serif" font-weight="400" font-size="100" fill="#F0F4F8" x="168">ouse</text>
  </g>

  <!-- Tagline -->
  <text x="550" y="330" font-family="'Inter', sans-serif" font-weight="400" font-size="26" fill="#969696">Sem cauda. Sem fios. Sem limites.</text>

  <!-- Gesture dots decoration -->
  <circle cx="1300" cy="120" r="4" fill="#50C8FF" opacity="0.6"/>
  <circle cx="1350" cy="180" r="4" fill="#5ADC5A" opacity="0.6"/>
  <circle cx="1280" cy="240" r="4" fill="#FF50C8" opacity="0.6"/>
  <circle cx="1370" cy="300" r="4" fill="#FFAA3C" opacity="0.6"/>
  <circle cx="1310" cy="360" r="4" fill="#B478FF" opacity="0.6"/>
  <circle cx="1390" cy="140" r="3" fill="#8CE1E1" opacity="0.4"/>
  <circle cx="1260" cy="320" r="3" fill="#4682FF" opacity="0.4"/>
</svg>