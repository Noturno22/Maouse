name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r license-server/requirements.txt ruff

      - name: Install system libraries (Qt, audio, display)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libportaudio2 xvfb

      - name: Lint (ruff)
        run: ruff check . --exclude .venv

      - name: Test (client)
        run: QT_QPA_PLATFORM=offscreen xvfb-run -a pytest tests -q

      - name: Test (license server)
        run: pytest license-server/tests -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/airmouse-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/airmouse-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
