name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r license-server/requirements.txt ruff

      # requirements-linux.txt nao era instalado por ninguem, e por isso
      # apodrecia em silencio: e assim que sobreviveu a alegacao de que
      # `websockets>=13.0` rebentava instalacoes limpas da EAS — duas semanas
      # sem ninguem a testar a premissa (ver RECONHECIMENTO_REMOTE.md 1.14.1).
      #
      # Este passo e o teste de que o manifesto resolve no runner. A protecao
      # contra divergencia de conteudo, essa, e tests/test_manifests.py, que
      # compara os tres manifestos com os imports do codigo.
      - name: Install Linux manifest (requirements-linux.txt)
        run: pip install -r requirements-linux.txt

      # O pyproject.toml e a fonte de verdade das dependencias. Este passo
      # apanha o caso em que o pacote declara coisas que nao instalam.
      - name: Build the package metadata
        run: pip install --dry-run --no-deps .

      - name: Install system libraries (Qt, audio, display)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libportaudio2 xvfb

      - name: Lint (ruff)
        run: ruff check . --exclude .venv

      - name: Test (client)
        run: QT_QPA_PLATFORM=offscreen xvfb-run -a pytest tests -q

      # Onda 0: imprime as metricas de reconhecimento do corpus de regressao
      # para o log do PR. Corre por DUAS razoes, porque respondem a perguntas
      # diferentes:
      #   * o portao contra regressao e
      #     tests/test_corpus_fixture.py (TestReplayMatchesBaseline), que corre
      #     acima e falha se alguma classe perder F1 face ao baseline commitado;
      #   * --replay-gate e o alvo de aceitacao (F1 macro >= 0.97, precisao do
      #     PINCH >= 0.99, 0 cliques fantasma/h) — trava a qualidade abaixo do
      #     anunciado.
      # O --replay-gate estava desligado porque o alvo de 0.97 falhava por
      # construcao (confusao PINKY/SHAKA, Onda 1 §1.3) e nao por qualidade: um
      # job sempre vermelho ensina a ignorar o job. Corrigida a confusao, o alvo
      # e atingido na fixture (F1 macro 1.0000) e o gate pode passar a valer.
      # NOTA HONESTA: mede a fixture SINTETICA. Trava contra piora de medicao,
      # nao prova qualidade em maos reais (falta o corpus real, Onda 3 §3.1).
      - name: Recognition report (replay do corpus de regressão, com gate)
        run: python main.py --replay tests/fixtures/corpus_regressao_v1.npz --replay-gate

      - name: Test (license server)
        run: pytest license-server/tests -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/airmouse-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/airmouse-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
